<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Qumanity — Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}" />
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/logo-qumanity-icon.svg') }}" />
</head>
<body>
  <header class="qm-header">
    <a href="{{ url_for('index') }}" style="display:contents">
      <img class="qm-logo" src="{{ url_for('static', filename='images/logo-qumanity-sm.svg') }}" alt="Qumanity" />
    </a>
    <div class="qm-header-text">
      <h1>Login</h1>
      <p>Sign in with your 9-digit Private ID and 5-character PIN.</p>
    </div>
  </header>

  <main class="qm-register-main">
    <section class="qm-screen is-active">
      <h2>Sign in</h2>
      <form id="login-form" class="qm-form" novalidate>
        <label class="qm-field">
          <span>🔢 9-digit Private ID</span>
          <input type="text" id="field-private-id" required inputmode="numeric" pattern="[0-9]{9}" maxlength="9" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="e.g. 583294017" />
        </label>
        <label class="qm-field">
          <span>🔑 5-character PIN</span>
          <input type="password" id="field-pin" required pattern="(?=.*[A-Za-z0-9])[A-Za-z0-9!@#$%^&amp;*()_+\-=\[\]{}|;:'&quot;,.&lt;&gt;/?]{5}" maxlength="5" autocomplete="current-password" placeholder="•••••" />
        </label>
        <button type="submit" class="qm-btn qm-btn-primary qm-form-submit">Sign in →</button>
      </form>
      <p class="qm-summary-error" id="login-error" hidden></p>
      <p class="qm-timeline-note">New here? <a href="/register">Create your account</a></p>
      <p class="qm-timeline-note"><a href="/forgot-pin">Forgot your PIN?</a> · <a href="/recover-id">Forgot your Private ID?</a></p>
      <a href="{{ url_for('index') }}" class="qm-btn qm-btn-ghost" style="margin-top:14px;display:inline-block;">← Back to Homepage</a>
    </section>
  </main>

  <script>
    (function () {
      "use strict";
      var form = document.getElementById("login-form");
      var errorEl = document.getElementById("login-error");
      var PIN_RE = /^(?=.*[A-Za-z0-9])[A-Za-z0-9!@#$%^&*()_+\-=\[\]{}|;:'",.<>/?]{5}$/;
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        errorEl.hidden = true;
        var pin = document.getElementById("field-pin").value;
        if (!PIN_RE.test(pin)) {
          errorEl.textContent = "PIN must be 5 characters. It can include numbers, letters, or special characters — but not all special characters.";
          errorEl.hidden = false;
          return;
        }
        fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            private_id: document.getElementById("field-private-id").value.trim(),
            pin: document.getElementById("field-pin").value.trim(),
          }),
        })
          .then(function (res) {
            return res.json().then(function (body) { return { ok: res.ok, body: body }; });
          })
          .then(function (result) {
            if (!result.ok) throw new Error(result.body.error || "Login failed");
            window.location.href = result.body.redirect;
          })
          .catch(function (err) {
            errorEl.textContent = err.message;
            errorEl.hidden = false;
          });
      });
    })();
  </script>
  <script src="{{ url_for('static', filename='js/logo_nav.js') }}"></script>
  {% include '_poems_marquee.html' %}
</body>
</html>
