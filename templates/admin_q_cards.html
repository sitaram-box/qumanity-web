<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Qumanity — Q-Cards</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/logo-qumanity-icon.svg') }}" />
  <style>
    .qcv-main { padding: 24px; max-width: 1100px; margin: 0 auto; }
    .qcv-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .qcv-tab { padding: 6px 14px; border-radius: 999px; border: 1px solid var(--qm-border); background: var(--qm-panel-bg); color: var(--qm-text); font: inherit; cursor: pointer; }
    .qcv-tab.is-active { background: var(--qm-gold); border-color: var(--qm-gold); color: #3a2d00; font-weight: 600; }
    .qcv-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 12px; }
    .qcv-filter-label { display: flex; align-items: center; gap: 6px; color: var(--qm-text); font-size: 14px; cursor: pointer; }
    .qcv-meta { color: var(--qm-text-dim); font-size: 14px; margin-bottom: 16px; }
    .qcv-table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--qm-border); }
    table.qcv-table { border-collapse: collapse; width: 100%; font-size: 14px; background: var(--qm-panel-bg); }
    table.qcv-table th, table.qcv-table td { padding: 8px 12px; border-bottom: 1px solid var(--qm-border); text-align: left; color: var(--qm-text); }
    table.qcv-table th { background: var(--qm-input-bg); font-weight: 600; }
    .qcv-pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
    .qcv-pill.has-pdf { background: rgba(19, 136, 8, 0.15); color: var(--qm-green); }
    .qcv-pill.no-pdf { background: var(--qm-input-bg); color: var(--qm-text-dim); }
    .qcv-pill.issued-no-pdf { background: rgba(255, 153, 51, 0.18); color: var(--qm-gold-text); }
    .qcv-empty { color: var(--qm-text-dim); padding: 20px; }
    .qcv-btn-disabled { opacity: 0.5; pointer-events: none; }
  </style>
</head>
<body>
  <header class="qm-header">
    <a href="{{ url_for('dashboard') }}" style="display:contents">
      <img class="qm-logo" src="{{ url_for('static', filename='images/logo-qumanity-sm.svg') }}" alt="Qumanity" />
    </a>
    <div class="qm-header-text">
      <h1>Q-Cards</h1>
      <p>Admin access only. <a href="{{ url_for('dashboard') }}">← Back to dashboard</a></p>
    </div>
  </header>

  <main class="qcv-main">
    <div class="qcv-tabs">
      <button type="button" class="qcv-tab {{ 'is-active' if user_type == 'real' else '' }}" id="qcv-tab-real" data-type="real">Real Users</button>
      <button type="button" class="qcv-tab {{ 'is-active' if user_type == 'test' else '' }}" id="qcv-tab-test" data-type="test">Test / Demo Users</button>
    </div>

    <div class="qcv-toolbar">
      <label class="qcv-filter-label">
        <input type="checkbox" id="qcv-filter-missing" />
        Show Only Users Without Q-Cards
      </label>
      <span id="qcv-combined-wrap"></span>
    </div>

    <p class="qcv-meta" id="qcv-meta"></p>

    <div class="qcv-table-wrap">
      <table class="qcv-table">
        <thead>
          <tr>
            <th>User ID</th><th>Name</th><th>Current Private ID</th><th>Card Status</th><th>Payment</th><th>PDF</th>
          </tr>
        </thead>
        <tbody id="qcv-tbody"></tbody>
      </table>
    </div>
    <p class="qcv-empty" id="qcv-empty" hidden>No users found in this view.</p>
  </main>

  <script>
    (function () {
      var DOWNLOAD_URL = {{ (url_for('admin_q_card_download', user_id=0)) | tojson }};
      var VIEW_URL = {{ (url_for('admin_q_card_view', user_id=0)) | tojson }};
      var ISSUE_URL = {{ (url_for('admin_q_card_issue', user_id=0)) | tojson }};
      var BULK_ISSUE_URL = {{ url_for('admin_q_cards_bulk_issue_and_combine') | tojson }};
      var DATA_URL = {{ url_for('admin_q_cards_data') | tojson }};
      var tbody = document.getElementById("qcv-tbody");
      var metaEl = document.getElementById("qcv-meta");
      var emptyEl = document.getElementById("qcv-empty");
      var combinedWrap = document.getElementById("qcv-combined-wrap");
      var filterMissing = document.getElementById("qcv-filter-missing");
      var tabs = document.querySelectorAll(".qcv-tab");
      var current = {{ user_type | tojson }};
      var lastData = null;

      function el(tag, props) {
        var e = document.createElement(tag);
        if (props) Object.keys(props).forEach(function (k) { e[k] = props[k]; });
        return e;
      }

      // Issuing a card used to be a plain <form target="_blank">, which opened the PDF in a new
      // tab but left THIS tab's table stale -- the Admin had to manually reload to see "Issue
      // Q-Card" turn into "Download PDF". Using fetch() + a Blob download instead lets this same
      // tab trigger the save AND immediately re-fetch fresh data once it succeeds.
      //
      // isRegenerate (2026-11-28) only changes the confirm wording and the button's reset label
      // on failure -- the backend route is identical either way (admin_q_card_issue() itself
      // decides issue vs. regenerate by whether a q_cards row already exists). The distinct
      // wording matters because regenerating silently invalidates the PREVIOUS card's token
      // (q_card_core.replace()), which "Issue a new Q-Card" doesn't convey for a user who
      // already has one.
      function issueCard(c, btn, isRegenerate) {
        var msg = isRegenerate
          ? "Regenerate the Q-Card for " + c.name + "? The previous card's token will stop working immediately and a new one will be created."
          : "Issue a new Q-Card for " + c.name + "? This creates a real, permanent card token for this user.";
        if (!window.confirm(msg)) return;
        btn.disabled = true;
        btn.textContent = isRegenerate ? "Regenerating…" : "Issuing…";
        fetch(ISSUE_URL.replace("/0/", "/" + c.user_id + "/"), { method: "POST" })
          .then(function (r) {
            if (!r.ok) return r.json().then(function (j) { throw new Error(j.error || "Failed to issue card"); });
            return r.blob();
          })
          .then(function (blob) {
            var url = URL.createObjectURL(blob);
            var a = el("a", { href: url, download: "q_card_" + c.user_id + ".pdf" });
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
            load(current); // refresh so this row reflects the new PDF (or drops out under the filter)
          })
          .catch(function (err) {
            alert(err.message);
            btn.disabled = false;
            btn.textContent = isRegenerate ? "Regenerate" : "Issue Q-Card";
          });
      }

      function renderRow(c) {
        var tr = document.createElement("tr");
        [c.user_id, c.name, c.current_private_id, c.status || "—", c.payment_status || "—"].forEach(function (val) {
          var td = document.createElement("td");
          td.textContent = val;
          tr.appendChild(td);
        });
        var pdfTd = document.createElement("td");
        if (c.has_pdf) {
          pdfTd.appendChild(el("span", { className: "qcv-pill has-pdf", textContent: "Found" }));
          pdfTd.appendChild(document.createTextNode(" "));
          pdfTd.appendChild(el("a", {
            href: VIEW_URL.replace("/0/", "/" + c.user_id + "/"), target: "_blank", rel: "noopener", textContent: "View PDF",
          }));
          pdfTd.appendChild(document.createTextNode(" "));
          var downloadLink = el("a", { href: DOWNLOAD_URL.replace("/0/", "/" + c.user_id + "/"), textContent: "Download PDF" });
          // Nothing changes server-side on a plain download (the file already exists), so there's
          // no need to re-fetch -- just re-apply the CURRENT filter against the data already in
          // hand. The native download (this is still a real <a href>, not preventDefault()'d)
          // proceeds in parallel; this only affects what's rendered in the table underneath it.
          downloadLink.addEventListener("click", function () { setTimeout(applyFilterAndRender, 0); });
          pdfTd.appendChild(downloadLink);
          pdfTd.appendChild(document.createTextNode(" "));
          var regenBtn = el("button", { type: "button", className: "qm-btn qm-btn-ghost", textContent: "Regenerate" });
          regenBtn.addEventListener("click", function () { issueCard(c, regenBtn, true); });
          pdfTd.appendChild(regenBtn);
        } else if (c.card_issued) {
          // A q_cards row exists but its PDF is missing from disk -- the Admin must always be
          // able to get a usable card, so this is just another regenerate (the ORIGINAL token can
          // never be recovered -- issue_card() only ever stored its hash -- so "generate on the
          // fly from the database" can only mean "mint a fresh one", exactly like Regenerate
          // above). Labeled "Generate PDF" rather than "Regenerate" here since, from the Admin's
          // perspective, there was never a working PDF to regenerate FROM in the first place.
          pdfTd.appendChild(el("span", { className: "qcv-pill issued-no-pdf", textContent: "Issued, file missing" }));
          pdfTd.appendChild(document.createTextNode(" "));
          var genBtn = el("button", { type: "button", className: "qm-btn qm-btn-ghost", textContent: "Generate PDF" });
          genBtn.addEventListener("click", function () { issueCard(c, genBtn, true); });
          pdfTd.appendChild(genBtn);
        } else {
          pdfTd.appendChild(el("span", { className: "qcv-pill no-pdf", textContent: "None on disk" }));
          pdfTd.appendChild(document.createTextNode(" "));
          var btn = el("button", { type: "button", className: "qm-btn qm-btn-ghost", textContent: "Issue Q-Card" });
          btn.addEventListener("click", function () { issueCard(c, btn); });
          pdfTd.appendChild(btn);
        }
        tr.appendChild(pdfTd);
        return tr;
      }

      function applyFilterAndRender() {
        if (!lastData) return;
        var cards = lastData.cards;
        if (filterMissing.checked) cards = cards.filter(function (c) { return !c.has_pdf; });

        tbody.innerHTML = "";
        cards.forEach(function (c) { tbody.appendChild(renderRow(c)); });
        emptyEl.hidden = cards.length > 0;

        var label = lastData.user_type === "real" ? "real user(s)" : "test/demo user(s)";
        var text = lastData.count + " " + label + " · " + lastData.found + " Q-Card PDF" +
          (lastData.found === 1 ? "" : "s") + " found on disk.";
        if (filterMissing.checked) text += " Showing " + cards.length + " without a Q-Card yet.";
        text += " A card only exists here if it was actually issued and its PDF successfully saved — there is no way to regenerate a lost PDF.";
        metaEl.textContent = text;

        // Download All (Task 3): always visible on the Real Users tab, not conditional on
        // found > 0 -- disabled-looking with no href when there is nothing to combine yet,
        // rather than hidden, so the Admin always knows the option exists.
        combinedWrap.innerHTML = "";
        if (lastData.user_type === "real") {
          var missing = lastData.count - lastData.found;
          var label2 = "⬇️ Download All Q-Cards (" + lastData.found + " found" +
            (missing > 0 ? ", " + missing + " to generate" : "") + ")";
          var allBtn = el("button", { type: "button", className: "qm-btn qm-btn-primary", textContent: label2 });
          allBtn.addEventListener("click", function () { bulkDownloadAll(missing, allBtn); });
          combinedWrap.appendChild(allBtn);
        }
      }

      // "Download All Q-Cards" (2026-11-28 rewrite): always hits the bulk POST route now, which
      // mints a fresh card for anyone still missing one before combining everything -- a strict
      // superset of the old read-only GET /combined.pdf (that route is untouched and still exists
      // for any direct/manual use, just no longer linked from this button). Only confirms when it
      // would actually mint something new; combining an already-complete set needs no warning.
      function bulkDownloadAll(missingCount, btn) {
        if (missingCount > 0) {
          var msg = "This will generate " + missingCount + " new Q-Card" + (missingCount === 1 ? "" : "s") +
            " for real users who don't have one yet, then combine everything into one PDF. Continue?";
          if (!window.confirm(msg)) return;
        }
        btn.disabled = true;
        var originalLabel = btn.textContent;
        btn.textContent = "Generating…";
        fetch(BULK_ISSUE_URL, { method: "POST" })
          .then(function (r) {
            if (!r.ok) return r.json().then(function (j) { throw new Error(j.error || "Failed to generate combined PDF"); });
            return r.blob();
          })
          .then(function (blob) {
            var url = URL.createObjectURL(blob);
            var a = el("a", { href: url, download: "q_cards_combined.pdf" });
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
            load(current); // refresh -- every previously-missing user now has a PDF
          })
          .catch(function (err) {
            alert(err.message);
            btn.disabled = false;
            btn.textContent = originalLabel;
          });
      }

      function load(type) {
        current = type;
        tabs.forEach(function (t) { t.classList.toggle("is-active", t.dataset.type === type); });
        fetch(DATA_URL + "?type=" + encodeURIComponent(type))
          .then(function (r) { return r.json(); })
          .then(function (data) { lastData = data; applyFilterAndRender(); })
          .catch(function (err) { metaEl.textContent = "Failed to load: " + err.message; });
      }

      tabs.forEach(function (t) {
        t.addEventListener("click", function () { load(t.dataset.type); });
      });
      filterMissing.addEventListener("change", applyFilterAndRender);

      load(current);
    })();
  </script>
</body>
</html>
