<svg viewBox="0 0 320 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d6title d6desc">
  <title id="d6title">The quantum qualities of Qumanity</title>
  <desc id="d6desc">Six quantum physics properties, each mapped to a Qumanity feature: superposition, entanglement, wave-particle duality, collapse, non-locality and coherence. Five are live today; non-locality is built but not yet active, shown with a hollow marker instead of a filled one.</desc>
  <text x="160" y="22" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#C9900C">THE QUANTUM QUALITIES OF QUMANITY</text>

  <!-- Row 1: Superposition (live) -->
  <circle cx="26" cy="74" r="7" fill="#C9900C"/>
  <rect x="50" y="44" width="254" height="60" rx="8" fill="#FFFFFF" stroke="#1D2733" stroke-width="2.5"/>
  <text x="62" y="60" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1D2733">Superposition</text>
  <text x="62" y="72" font-family="Arial, Helvetica, sans-serif" font-size="10" font-style="italic" fill="#6B7684">One state, many positions at once</text>
  <text x="62" y="86" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1D2733">Present location sets your standing</text>
  <text x="62" y="98" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1D2733">at all eight levels, at once</text>

  <!-- Row 2: Entanglement (live) -->
  <circle cx="26" cy="140" r="7" fill="#C9900C"/>
  <rect x="50" y="110" width="254" height="60" rx="8" fill="#FFFFFF" stroke="#1D2733" stroke-width="2.5"/>
  <text x="62" y="126" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1D2733">Entanglement</text>
  <text x="62" y="138" font-family="Arial, Helvetica, sans-serif" font-size="10" font-style="italic" fill="#6B7684">Linked states, correlated apart</text>
  <text x="62" y="152" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1D2733">A post that elevates and its new</text>
  <text x="62" y="164" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1D2733">record one level up move together</text>

  <!-- Row 3: Wave-particle duality (live) -->
  <circle cx="26" cy="206" r="7" fill="#C9900C"/>
  <rect x="50" y="176" width="254" height="60" rx="8" fill="#FFFFFF" stroke="#1D2733" stroke-width="2.5"/>
  <text x="62" y="192" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1D2733">Wave-particle duality</text>
  <text x="62" y="204" font-family="Arial, Helvetica, sans-serif" font-size="10" font-style="italic" fill="#6B7684">The same thing, two valid views</text>
  <text x="62" y="218" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1D2733">One member: a private profile,</text>
  <text x="62" y="230" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1D2733">or one line in a public total</text>

  <!-- Row 4: Collapse / measurement (live) -->
  <circle cx="26" cy="272" r="7" fill="#C9900C"/>
  <rect x="50" y="242" width="254" height="60" rx="8" fill="#FFFFFF" stroke="#1D2733" stroke-width="2.5"/>
  <text x="62" y="258" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1D2733">Collapse</text>
  <text x="62" y="270" font-family="Arial, Helvetica, sans-serif" font-size="10" font-style="italic" fill="#6B7684">Undetermined, until observed</text>
  <text x="62" y="284" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1D2733">A post has no fixed outcome until</text>
  <text x="62" y="296" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1D2733">the vote resolves it — one of three</text>

  <!-- Row 5: Non-locality (built, not yet active; hollow marker) -->
  <circle cx="26" cy="338" r="7" fill="#FFFFFF" stroke="#9AA3AD" stroke-width="2"/>
  <rect x="50" y="308" width="254" height="60" rx="8" fill="#FFFFFF" stroke="#1D2733" stroke-width="2.5"/>
  <text x="62" y="324" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1D2733">Non-locality</text>
  <text x="62" y="336" font-family="Arial, Helvetica, sans-serif" font-size="10" font-style="italic" fill="#6B7684">Change without a local trigger</text>
  <text x="62" y="350" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1D2733">Moves records up on its own</text>
  <text x="62" y="362" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1D2733">schedule — built, not yet active</text>

  <!-- Row 6: Coherence (live) -->
  <circle cx="26" cy="404" r="7" fill="#C9900C"/>
  <rect x="50" y="374" width="254" height="60" rx="8" fill="#FFFFFF" stroke="#1D2733" stroke-width="2.5"/>
  <text x="62" y="390" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1D2733">Coherence</text>
  <text x="62" y="402" font-family="Arial, Helvetica, sans-serif" font-size="10" font-style="italic" fill="#6B7684">A stable state, held together</text>
  <text x="62" y="416" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1D2733">A location's karma, Qoins and real</text>
  <text x="62" y="428" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1D2733">member count — public, permanent</text>

  <!-- Caveat, travels with the image -->
  <text x="160" y="455" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-style="italic" fill="#6B7684">An analogy, not a computing claim.</text>
</svg>
