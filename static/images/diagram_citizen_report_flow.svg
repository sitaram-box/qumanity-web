<svg viewBox="0 0 320 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d3title d3desc">
  <title id="d3title">The flow of a Citizen Report</title>
  <desc id="d3desc">A report filed at the village, a ten-day council deadline, escalation upward if the deadline passes, and a permanent audit trail.</desc>
  <text x="160" y="22" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#C9900C">A CITIZEN REPORT</text>

  <!-- Step 1: Filed at the Village -->
  <circle cx="46" cy="58" r="17" fill="#C9900C"/>
  <text x="46" y="63" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1D2733">1</text>
  <rect x="76" y="38" width="208" height="40" rx="8" fill="#FFFFFF" stroke="#1D2733" stroke-width="2.5"/>
  <text x="180" y="63" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1D2733">Filed at the Village</text>

  <!-- connector 1-2 -->
  <line x1="46" y1="75" x2="46" y2="117" stroke="#1D2733" stroke-width="2.5"/>
  <polygon points="46,128 39,114 53,114" fill="#1D2733"/>

  <!-- Step 2: 10-day deadline -->
  <circle cx="46" cy="156" r="17" fill="#C9900C"/>
  <text x="46" y="161" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1D2733">2</text>
  <rect x="76" y="130" width="208" height="52" rx="8" fill="#FFFFFF" stroke="#1D2733" stroke-width="2.5"/>
  <text x="180" y="152" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1D2733">The council has 10 days</text>
  <text x="180" y="170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1D2733">to respond</text>

  <!-- connector 2-3, labelled -->
  <line x1="46" y1="199" x2="46" y2="241" stroke="#E0631F" stroke-width="2.5"/>
  <polygon points="46,252 39,238 53,238" fill="#E0631F"/>
  <text x="180" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-style="italic" fill="#E0631F">if there is no response in time</text>

  <!-- Step 3: escalation (accent colour) -->
  <circle cx="46" cy="280" r="17" fill="#E0631F"/>
  <text x="46" y="285" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">3</text>
  <rect x="76" y="254" width="208" height="52" rx="8" fill="#FFFFFF" stroke="#E0631F" stroke-width="2.5"/>
  <text x="180" y="276" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1D2733">It escalates upward —</text>
  <text x="180" y="294" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1D2733">a fresh 10-day clock starts</text>

  <!-- connector 3-4 -->
  <line x1="46" y1="323" x2="46" y2="365" stroke="#1D2733" stroke-width="2.5"/>
  <polygon points="46,376 39,362 53,362" fill="#1D2733"/>

  <!-- Step 4: audit trail -->
  <circle cx="46" cy="404" r="17" fill="#C9900C"/>
  <text x="46" y="409" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1D2733">4</text>
  <rect x="76" y="378" width="208" height="52" rx="8" fill="#FFFFFF" stroke="#1D2733" stroke-width="2.5"/>
  <text x="180" y="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1D2733">Every step is timestamped —</text>
  <text x="180" y="418" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1D2733">the reporter can follow it</text>

  <!-- caption -->
  <text x="160" y="456" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1D2733">Nothing is answered in silence, and nothing is forgotten.</text>
</svg>
